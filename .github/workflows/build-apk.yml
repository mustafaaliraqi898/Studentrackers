name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-native/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build APK
        working-directory: android-native
        run: gradle assembleDebug --no-daemon --max-workers=1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: student-tracker-debug-apk
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
